[package]
name = "nanogbm"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Olivier Giniaux <oginiaux@gmail.com>"]
repository = "https://github.com/ogxd/nanogbm"
homepage = "https://github.com/ogxd/nanogbm"
documentation = "https://docs.rs/nanogbm"
description = "A small, pure-Rust gradient boosting library (GBDT, binary classification, CPU only)."
readme = "README.md"
keywords = ["gbdt", "boosting", "machine-learning", "classification", "gradient-boosting"]
categories = ["science", "algorithms", "mathematics"]
exclude = [
    "/.github",
    "/CLAUDE.md",
    "/.DS_Store",
    "**/.DS_Store",
]

# gxhash requires AES (and SSE2 on x86) intrinsics at compile time. The
# workspace .cargo/config.toml enables them for local/CI builds, but that file
# isn't packaged and is ignored when nanogbm is a dependency — so docs.rs would
# otherwise hit gxhash's compile_error!. Pass the flags through here; docs.rs
# builds on x86_64-unknown-linux-gnu, so the x86 features apply.
[package.metadata.docs.rs]
rustc-args = ["-C", "target-feature=+aes,+sse2"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1.0"
gxhash = "3"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hot_paths"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Benches inherit `release`, but criterion measurements are sharper with
# slightly different settings. Override here so `cargo bench` runs with full
# optimization but without LTO (faster builds, identical inner-loop codegen).
[profile.bench]
opt-level = 3
lto = false
codegen-units = 1
debug = false
