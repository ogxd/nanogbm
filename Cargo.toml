[package]
name = "nanogbm"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Olivier Giniaux <oginiaux@equativ.com>"]
repository = "https://github.com/oginiaux/nanogbm"
description = "A pure-Rust gradient boosting library (GBDT, binary classification, CPU only)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1.0"
gxhash = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
